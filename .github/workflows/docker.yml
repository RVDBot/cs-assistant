name: Build & Push Docker Image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, needed to count commits for the version

      # Patch number = commits since package.json's version was last changed,
      # so 0.7.0 becomes 0.7.1, 0.7.2, … without bumping it by hand
      - name: Compute version patch
        id: version
        run: |
          base=$(git log -1 --format=%H -G'"version":' -- package.json)
          echo "patch=$(git rev-list --count "$base"..HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/rvdbot/cs-assistant:latest
          build-args: |
            BUILDKIT_PROGRESS=plain
            GIT_SHA=${{ github.sha }}
            BUILD_PATCH=${{ steps.version.outputs.patch }}
